AWSTemplateFormatVersion: '2010-09-09'
Description: >
  UK Clearing Advisor - Data stack. All DynamoDB tables (on-demand,
  encrypted at rest, point-in-time recovery, TTL where applicable).

Parameters:
  Environment:
    Type: String
    Default: production
    AllowedValues: [production, staging]
  TablePrefix:
    Type: String
    Default: ClearingAdvisor
    Description: Prefix for all table names.

Resources:

  # Persistent university contact/metadata. No TTL (reference data).
  UniversityContactsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub '${TablePrefix}-UniversityContacts'
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: providerCode
          AttributeType: S
      KeySchema:
        - AttributeName: providerCode
          KeyType: HASH
      Tags:
        - { Key: Application, Value: uk-clearing-advisor }
        - { Key: Environment, Value: !Ref Environment }

  # Short-lived cache of merged UCAS + Discover Uni data.
  ClearingCacheTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${TablePrefix}-ClearingCache'
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      AttributeDefinitions:
        - { AttributeName: cacheKey, AttributeType: S }
        - { AttributeName: provider, AttributeType: S }
      KeySchema:
        - { AttributeName: cacheKey, KeyType: HASH }
        - { AttributeName: provider, KeyType: RANGE }
      Tags:
        - { Key: Application, Value: uk-clearing-advisor }
        - { Key: Environment, Value: !Ref Environment }

  ScholarshipsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub '${TablePrefix}-Scholarships'
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - { AttributeName: universityId, AttributeType: S }
        - { AttributeName: scholarshipId, AttributeType: S }
        - { AttributeName: subjectGroup, AttributeType: S }
      KeySchema:
        - { AttributeName: universityId, KeyType: HASH }
        - { AttributeName: scholarshipId, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: SubjectIndex
          KeySchema:
            - { AttributeName: subjectGroup, KeyType: HASH }
          Projection:
            ProjectionType: ALL
      Tags:
        - { Key: Application, Value: uk-clearing-advisor }
        - { Key: Environment, Value: !Ref Environment }

  ChangeLogTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${TablePrefix}-ChangeLog'
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      AttributeDefinitions:
        - { AttributeName: changeDate, AttributeType: S }
        - { AttributeName: changeTimestamp, AttributeType: S }
      KeySchema:
        - { AttributeName: changeDate, KeyType: HASH }
        - { AttributeName: changeTimestamp, KeyType: RANGE }
      Tags:
        - { Key: Application, Value: uk-clearing-advisor }
        - { Key: Environment, Value: !Ref Environment }

  QueryCacheTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${TablePrefix}-QueryCache'
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      AttributeDefinitions:
        - { AttributeName: queryId, AttributeType: S }
      KeySchema:
        - { AttributeName: queryId, KeyType: HASH }
      Tags:
        - { Key: Application, Value: uk-clearing-advisor }
        - { Key: Environment, Value: !Ref Environment }

  RateLimitsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${TablePrefix}-RateLimits'
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      AttributeDefinitions:
        - { AttributeName: limitKey, AttributeType: S }
        - { AttributeName: windowStart, AttributeType: S }
      KeySchema:
        - { AttributeName: limitKey, KeyType: HASH }
        - { AttributeName: windowStart, KeyType: RANGE }
      Tags:
        - { Key: Application, Value: uk-clearing-advisor }
        - { Key: Environment, Value: !Ref Environment }

  SubjectDefaultsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub '${TablePrefix}-SubjectDefaults'
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - { AttributeName: subjectGroup, AttributeType: S }
      KeySchema:
        - { AttributeName: subjectGroup, KeyType: HASH }
      Tags:
        - { Key: Application, Value: uk-clearing-advisor }
        - { Key: Environment, Value: !Ref Environment }

  CUGRankingsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub '${TablePrefix}-CUGRankings'
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      AttributeDefinitions:
        - { AttributeName: providerCode, AttributeType: S }
        - { AttributeName: subjectCode, AttributeType: S }
      KeySchema:
        - { AttributeName: providerCode, KeyType: HASH }
        - { AttributeName: subjectCode, KeyType: RANGE }
      Tags:
        - { Key: Application, Value: uk-clearing-advisor }
        - { Key: Environment, Value: !Ref Environment }

  # Real per-course vacancy data, scraped directly from a small set of
  # university clearing pages whose course listings are genuine static
  # server-rendered HTML (see WELL-ARCHITECTED.md / CHANGELOG - confirmed
  # for exactly 4 of the 44 seeded universities: Manchester, UCL, Warwick,
  # Lincoln. Every other university's clearing page only loads its course
  # list via client-side JS/AJAX, which this project's Lambda-based scraper
  # cannot execute). Deliberately a SEPARATE table from ClearingCacheTable/
  # UniversityContactsTable - this is real, per-course, confirmed-on-a-
  # specific-page data, not the estimated/national-average data the rest of
  # the app serves, and the two must never be able to silently merge into
  # one write path.
  # TTL is intentionally short (see ScrapeConfirmedCoursesFunction's own
  # scrapedAt/ttl fields) - if the scraper Lambda breaks or a site's HTML
  # changes and scraping silently stops, this data must disappear rather
  # than keep showing an increasingly stale "confirmed" course list that
  # looks just as fresh as one scraped 5 minutes ago.
  ScrapedCoursesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${TablePrefix}-ScrapedCourses'
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      AttributeDefinitions:
        - { AttributeName: providerCode, AttributeType: S }
        - { AttributeName: courseKey, AttributeType: S }
      KeySchema:
        - { AttributeName: providerCode, KeyType: HASH }
        - { AttributeName: courseKey, KeyType: RANGE }
      Tags:
        - { Key: Application, Value: uk-clearing-advisor }
        - { Key: Environment, Value: !Ref Environment }

Outputs:
  UniversityContactsTable:
    Value: !Ref UniversityContactsTable
    Export: { Name: !Sub '${AWS::StackName}-UniversityContactsTable' }
  ClearingCacheTable:
    Value: !Ref ClearingCacheTable
    Export: { Name: !Sub '${AWS::StackName}-ClearingCacheTable' }
  ScholarshipsTable:
    Value: !Ref ScholarshipsTable
    Export: { Name: !Sub '${AWS::StackName}-ScholarshipsTable' }
  ChangeLogTable:
    Value: !Ref ChangeLogTable
    Export: { Name: !Sub '${AWS::StackName}-ChangeLogTable' }
  QueryCacheTable:
    Value: !Ref QueryCacheTable
    Export: { Name: !Sub '${AWS::StackName}-QueryCacheTable' }
  RateLimitsTable:
    Value: !Ref RateLimitsTable
    Export: { Name: !Sub '${AWS::StackName}-RateLimitsTable' }
  SubjectDefaultsTable:
    Value: !Ref SubjectDefaultsTable
    Export: { Name: !Sub '${AWS::StackName}-SubjectDefaultsTable' }
  CUGRankingsTable:
    Value: !Ref CUGRankingsTable
    Export: { Name: !Sub '${AWS::StackName}-CUGRankingsTable' }
  ScrapedCoursesTable:
    Value: !Ref ScrapedCoursesTable
    Export: { Name: !Sub '${AWS::StackName}-ScrapedCoursesTable' }
