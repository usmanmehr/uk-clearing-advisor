AWSTemplateFormatVersion: '2010-09-09'
Description: >
  UK Clearing Advisor - Compute stack. Four Node.js 22 Lambda functions
  (AWS SDK v3 only), one least-privilege role each, explicit log groups.

Parameters:
  Environment: { Type: String, Default: production, AllowedValues: [production, staging] }
  LogLevel: { Type: String, Default: INFO, AllowedValues: [INFO, DEBUG] }
  ArtifactsBucket: { Type: String, Default: uk-clearing-advisor-artifacts-REPLACE_ACCOUNT_ID }
  ContactsTable: { Type: String, Default: ClearingAdvisor-UniversityContacts }
  SubjectDefaultsTable: { Type: String, Default: ClearingAdvisor-SubjectDefaults }
  CUGTable: { Type: String, Default: ClearingAdvisor-CUGRankings }
  ScholarshipsTable: { Type: String, Default: ClearingAdvisor-Scholarships }
  QueryCacheTable: { Type: String, Default: ClearingAdvisor-QueryCache }
  RateLimitsTable: { Type: String, Default: ClearingAdvisor-RateLimits }
  ClearingCacheTable: { Type: String, Default: ClearingAdvisor-ClearingCache }
  ChangeLogTable: { Type: String, Default: ClearingAdvisor-ChangeLog }
  ExportsBucket: { Type: String, Default: uk-clearing-advisor-exports-REPLACE_ACCOUNT_ID }
  SearchFunctionName: { Type: String, Default: ClearingAdvisor-SearchCourses }
  ApiOriginSecret:
    Type: String
    NoEcho: true
    MinLength: 20
    Description: >
      Shared secret CloudFront sends as X-Origin-Verify. Every API-facing
      Lambda (SearchCourses, GetSubjects, GetUniversities, GetScholarships,
      GenerateExport) checks this and rejects requests that skip CloudFront
      and hit execute-api directly. Must match the ApiOriginSecret used in
      the cdn stack. No default on purpose - a deploy that forgets to pass
      this must fail loudly rather than silently falling back to a guessable
      placeholder (deploy.sh always generates/passes a real one).

Mappings: {}

Resources:

  # ---------------- Log groups (explicit retention) ----------------
  SearchCoursesLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: /aws/lambda/ClearingAdvisor-SearchCourses
      RetentionInDays: 30
  GetSubjectsLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: /aws/lambda/ClearingAdvisor-GetSubjects
      RetentionInDays: 14
  GetUniversitiesLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: /aws/lambda/ClearingAdvisor-GetUniversities
      RetentionInDays: 14
  GetScholarshipsLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: /aws/lambda/ClearingAdvisor-GetScholarships
      RetentionInDays: 14
  GenerateExportLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: /aws/lambda/ClearingAdvisor-GenerateExport
      RetentionInDays: 30
  DailyScraperLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: /aws/lambda/ClearingAdvisor-DailyScraper
      RetentionInDays: 30
  WarmUpLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: /aws/lambda/ClearingAdvisor-WarmUp
      RetentionInDays: 14
  HealthLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: /aws/lambda/ClearingAdvisor-Health
      RetentionInDays: 7
  CostReporterLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: /aws/lambda/ClearingAdvisor-CostReporter
      RetentionInDays: 14

  # ---------------- IAM roles (least privilege) ----------------
  SearchCoursesRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
      Policies:
        - PolicyName: search-data-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ['dynamodb:Scan', 'dynamodb:GetItem', 'dynamodb:Query']
                Resource:
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ContactsTable}'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${SubjectDefaultsTable}'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${CUGTable}'
              - Effect: Allow
                Action: ['dynamodb:GetItem', 'dynamodb:PutItem', 'dynamodb:UpdateItem', 'dynamodb:Query']
                Resource:
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ClearingCacheTable}'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${QueryCacheTable}'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${RateLimitsTable}'
              - Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: '*'
                Condition:
                  StringEquals: { 'cloudwatch:namespace': ClearingAdvisor }

  GetUniversitiesRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: read-contacts
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ['dynamodb:Scan']
                Resource: !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ContactsTable}'

  GetScholarshipsRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: read-scholarships
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ['dynamodb:Query']
                Resource:
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ScholarshipsTable}'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ScholarshipsTable}/index/*'

  GetSubjectsRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  GenerateExportRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
      Policies:
        - PolicyName: export-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ['dynamodb:GetItem', 'dynamodb:UpdateItem']
                Resource: !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${QueryCacheTable}'
              - Effect: Allow
                Action: ['dynamodb:UpdateItem']
                Resource: !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${RateLimitsTable}'
              - Effect: Allow
                Action: ['s3:PutObject', 's3:GetObject']
                Resource: !Sub 'arn:aws:s3:::${ExportsBucket}/exports/*'
              - Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: '*'
                Condition:
                  StringEquals: { 'cloudwatch:namespace': ClearingAdvisor }

  # Dead-letter queue for DailyScraper's async invocations (EventBridge
  # Scheduler/Rule -> Lambda is always async, so a failed invocation is
  # normally retried twice then silently dropped with nothing beyond a
  # CloudWatch Logs error for that one run - see WELL-ARCHITECTED.md's
  # "no DLQ on async-invoked functions" gap). Wired as the Lambda's
  # OnFailure Destination below (DailyScraperEventInvokeConfig), not the
  # function's own DeadLetterConfig - Destinations carry structured JSON
  # (invocation request/response/error), which is what the new Grafana
  # freshness dashboard's DLQ panel actually needs to show something
  # useful, rather than DeadLetterConfig's raw event payload only.
  # 14-day retention (SQS max) so a failure is never lost before someone
  # notices it on the dashboard.
  DailyScraperDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: ClearingAdvisor-DailyScraperDLQ
      MessageRetentionPeriod: 1209600

  DailyScraperRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: scraper-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ['dynamodb:Scan', 'dynamodb:UpdateItem']
                Resource: !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ContactsTable}'
              - Effect: Allow
                Action: ['dynamodb:PutItem']
                Resource: !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ChangeLogTable}'
              - Effect: Allow
                Action: ['dynamodb:GetItem', 'dynamodb:PutItem']
                Resource: !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ClearingCacheTable}'
              - Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: '*'
                Condition:
                  StringEquals: { 'cloudwatch:namespace': ClearingAdvisor }
              # Required for Lambda to deliver a failed async invocation's
              # payload to the OnFailure destination queue below - this is
              # the Lambda SERVICE's own delivery action, but it acts using
              # the function's execution role, so the role needs it too.
              - Effect: Allow
                Action: ['sqs:SendMessage']
                Resource: !GetAtt DailyScraperDLQ.Arn

  WarmUpRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: invoke-search
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ['lambda:InvokeFunction']
                Resource: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${SearchFunctionName}'

  HealthRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: health-check-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ['dynamodb:GetItem']
                Resource: !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ContactsTable}'

  CostReporterRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: cost-explorer-read
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # ce:GetCostAndUsage is a read-only, account-scoped Cost
              # Explorer API - it does not support resource-level ARNs, so
              # Resource: '*' is required here (there is nothing narrower to
              # scope to). Read-only and non-destructive.
              - Effect: Allow
                Action: ['ce:GetCostAndUsage']
                Resource: '*'
              - Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: '*'
                Condition:
                  StringEquals: { 'cloudwatch:namespace': ClearingAdvisor }

  # EventBridge Scheduler (not a classic Events::Rule) invokes targets via an
  # assumed IAM role rather than a resource-based Lambda permission, and
  # supports a real StartDate/EndDate - which is why this is used for the
  # pre-Results-Day scraper ramp-up below instead of a cron() rule (a cron
  # rule has no native end date and would run forever until disabled by
  # hand).
  RampUpScraperSchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
            # Confused-deputy hardening (AWS-recommended): only schedules in
            # this account's default schedule group may assume this role.
            # Scoped to the schedule GROUP, not the individual schedule ARN,
            # to avoid a circular dependency between this role and the
            # schedule resource that references it.
            Condition:
              StringEquals:
                'aws:SourceAccount': !Ref 'AWS::AccountId'
              ArnLike:
                'aws:SourceArn': !Sub 'arn:aws:scheduler:${AWS::Region}:${AWS::AccountId}:schedule-group/default'
      Policies:
        - PolicyName: invoke-scraper
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ['lambda:InvokeFunction']
                Resource: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:ClearingAdvisor-DailyScraper'

  # ---------------- Lambda functions ----------------
  SearchCoursesFunction:
    Type: AWS::Lambda::Function
    DependsOn: SearchCoursesLogGroup
    Properties:
      FunctionName: ClearingAdvisor-SearchCourses
      Runtime: nodejs22.x
      Handler: index.handler
      MemorySize: 512
      Timeout: 10
      Role: !GetAtt SearchCoursesRole.Arn
      TracingConfig: { Mode: Active }
      Code:
        S3Bucket: !Ref ArtifactsBucket
        S3Key: lambda/SearchCourses-v20.zip
      Environment:
        Variables:
          CONTACTS_TABLE: !Ref ContactsTable
          SUBJECT_DEFAULTS_TABLE: !Ref SubjectDefaultsTable
          CUG_TABLE: !Ref CUGTable
          CLEARING_CACHE_TABLE: !Ref ClearingCacheTable
          QUERY_CACHE_TABLE: !Ref QueryCacheTable
          RATE_LIMITS_TABLE: !Ref RateLimitsTable
          METRICS_NAMESPACE: ClearingAdvisor
          ENVIRONMENT: !Ref Environment
          LOG_LEVEL: !Ref LogLevel
          API_ORIGIN_SECRET: !Ref ApiOriginSecret

  # Published version + alias so provisioned concurrency can serve API traffic.
  # NOTE: code has been hotfixed directly via the CLI a few times (accuracy
  # fixes, no-caching, search-insight logging) between IaC deploys. The S3Key
  # above and this Version resource are kept in sync with the live alias so
  # the next `cloudformation deploy` reconciles rather than reverts state.
  SearchCoursesVersionV6:
    Type: AWS::Lambda::Version
    Properties:
      FunctionName: !Ref SearchCoursesFunction
  SearchCoursesAlias:
    Type: AWS::Lambda::Alias
    Properties:
      Name: live
      FunctionName: !Ref SearchCoursesFunction
      FunctionVersion: !GetAtt SearchCoursesVersionV6.Version

  GetSubjectsFunction:
    Type: AWS::Lambda::Function
    DependsOn: GetSubjectsLogGroup
    Properties:
      FunctionName: ClearingAdvisor-GetSubjects
      Runtime: nodejs22.x
      Handler: index.handler
      MemorySize: 128
      Timeout: 5
      Role: !GetAtt GetSubjectsRole.Arn
      Code:
        S3Bucket: !Ref ArtifactsBucket
        S3Key: lambda/GetSubjects-v2.zip
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          LOG_LEVEL: !Ref LogLevel
          API_ORIGIN_SECRET: !Ref ApiOriginSecret

  GetUniversitiesFunction:
    Type: AWS::Lambda::Function
    DependsOn: GetUniversitiesLogGroup
    Properties:
      FunctionName: ClearingAdvisor-GetUniversities
      Runtime: nodejs22.x
      Handler: index.handler
      MemorySize: 256
      Timeout: 10
      Role: !GetAtt GetUniversitiesRole.Arn
      Code:
        S3Bucket: !Ref ArtifactsBucket
        S3Key: lambda/GetUniversities-v3.zip
      Environment:
        Variables:
          CONTACTS_TABLE: !Ref ContactsTable
          ENVIRONMENT: !Ref Environment
          LOG_LEVEL: !Ref LogLevel
          API_ORIGIN_SECRET: !Ref ApiOriginSecret

  GetScholarshipsFunction:
    Type: AWS::Lambda::Function
    DependsOn: GetScholarshipsLogGroup
    Properties:
      FunctionName: ClearingAdvisor-GetScholarships
      Runtime: nodejs22.x
      Handler: index.handler
      MemorySize: 256
      Timeout: 10
      Role: !GetAtt GetScholarshipsRole.Arn
      Code:
        S3Bucket: !Ref ArtifactsBucket
        S3Key: lambda/GetScholarships-v2.zip
      Environment:
        Variables:
          SCHOLARSHIPS_TABLE: !Ref ScholarshipsTable
          ENVIRONMENT: !Ref Environment
          LOG_LEVEL: !Ref LogLevel
          API_ORIGIN_SECRET: !Ref ApiOriginSecret

  GenerateExportFunction:
    Type: AWS::Lambda::Function
    DependsOn: GenerateExportLogGroup
    Properties:
      FunctionName: ClearingAdvisor-GenerateExport
      Runtime: nodejs22.x
      Handler: index.handler
      MemorySize: 1024
      Timeout: 30
      Role: !GetAtt GenerateExportRole.Arn
      TracingConfig: { Mode: Active }
      Code:
        S3Bucket: !Ref ArtifactsBucket
        S3Key: lambda/GenerateExport-v2.zip
      Environment:
        Variables:
          QUERY_CACHE_TABLE: !Ref QueryCacheTable
          RATE_LIMITS_TABLE: !Ref RateLimitsTable
          EXPORTS_BUCKET: !Ref ExportsBucket
          METRICS_NAMESPACE: ClearingAdvisor
          ENVIRONMENT: !Ref Environment
          LOG_LEVEL: !Ref LogLevel
          API_ORIGIN_SECRET: !Ref ApiOriginSecret

  DailyScraperFunction:
    Type: AWS::Lambda::Function
    DependsOn: DailyScraperLogGroup
    Properties:
      FunctionName: ClearingAdvisor-DailyScraper
      Runtime: nodejs22.x
      Handler: index.handler
      MemorySize: 512
      Timeout: 300
      Role: !GetAtt DailyScraperRole.Arn
      Code:
        S3Bucket: !Ref ArtifactsBucket
        S3Key: lambda/DailyScraper-v6.zip
      Environment:
        Variables:
          CONTACTS_TABLE: !Ref ContactsTable
          CHANGELOG_TABLE: !Ref ChangeLogTable
          CLEARING_CACHE_TABLE: !Ref ClearingCacheTable
          METRICS_NAMESPACE: ClearingAdvisor
          ENVIRONMENT: !Ref Environment
          LOG_LEVEL: !Ref LogLevel

  # Routes a failed ASYNC invocation of DailyScraper (every schedule that
  # triggers it - EventBridge Scheduler and classic Rules alike - invokes
  # it asynchronously) to DailyScraperDLQ above, after Lambda's own 2
  # automatic retries are exhausted. Qualifier '$LATEST' because every
  # schedule invokes the unqualified function, not an alias/version (only
  # SearchCourses uses the 'live' alias pattern - DailyScraper has no
  # alias). MaximumRetryAttempts left at the default (2) intentionally -
  # this only changes what happens AFTER retries are exhausted, not the
  # retry behaviour itself.
  DailyScraperEventInvokeConfig:
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref DailyScraperFunction
      Qualifier: '$LATEST'
      DestinationConfig:
        OnFailure:
          Destination: !GetAtt DailyScraperDLQ.Arn

  WarmUpFunction:
    Type: AWS::Lambda::Function
    DependsOn: WarmUpLogGroup
    Properties:
      FunctionName: ClearingAdvisor-WarmUp
      Runtime: nodejs22.x
      Handler: index.handler
      MemorySize: 256
      Timeout: 60
      Role: !GetAtt WarmUpRole.Arn
      Code:
        S3Bucket: !Ref ArtifactsBucket
        S3Key: lambda/WarmUp.zip
      Environment:
        Variables:
          SEARCH_FUNCTION_NAME: !Ref SearchFunctionName
          ENVIRONMENT: !Ref Environment
          LOG_LEVEL: !Ref LogLevel

  HealthFunction:
    Type: AWS::Lambda::Function
    DependsOn: HealthLogGroup
    Properties:
      FunctionName: ClearingAdvisor-Health
      Runtime: nodejs22.x
      Handler: index.handler
      MemorySize: 128
      Timeout: 5
      Role: !GetAtt HealthRole.Arn
      Code:
        S3Bucket: !Ref ArtifactsBucket
        S3Key: lambda/Health-v1.zip
      Environment:
        Variables:
          CONTACTS_TABLE: !Ref ContactsTable

  # Cost dashboard support: reads yesterday's spend (Application=uk-clearing-
  # advisor cost allocation tag) from Cost Explorer and publishes it as a
  # CloudWatch metric so it can sit in Grafana next to the operational
  # panels. See lambda/CostReporter/index.mjs for the full reasoning - this
  # account also runs unrelated workloads, so account-level billing alone
  # would be meaningless.
  CostReporterFunction:
    Type: AWS::Lambda::Function
    DependsOn: CostReporterLogGroup
    Properties:
      FunctionName: ClearingAdvisor-CostReporter
      Runtime: nodejs22.x
      Handler: index.handler
      MemorySize: 128
      Timeout: 30
      Role: !GetAtt CostReporterRole.Arn
      Code:
        S3Bucket: !Ref ArtifactsBucket
        S3Key: lambda/CostReporter-v1.zip
      Environment:
        Variables:
          METRICS_NAMESPACE: ClearingAdvisor
          COST_TAG_KEY: Application
          COST_TAG_VALUE: uk-clearing-advisor

  # Daily scraper at 07:00 UTC, year-round EXCEPT 12-13 Aug 2026, which get
  # their own dedicated, denser schedules below (Aug12Schedule,
  # Aug13MorningSchedule, Aug13EveningSchedule). Split into two
  # EventBridge Scheduler resources (not one always-on classic
  # AWS::Events::Rule cron) specifically so it can carry a real
  # StartDate/EndDate - a classic cron rule has no native way to skip two
  # specific dates, which is what caused the previous design's duplicate
  # 07:00 UTC runs on 12/13 Aug (the daily cron firing on TOP of the
  # ramp-up/Results-Day schedules, not instead of them).
  DailyScraperScheduleEarly:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: ClearingAdvisor-DailyScraperEarly
      Description: >-
        Daily 07:00 UTC scrape, up to and including 11 Aug 2026 - the day
        before the 12/13 Aug dedicated schedules take over.
      ScheduleExpression: 'cron(0 7 * * ? *)'
      ScheduleExpressionTimezone: UTC
      EndDate: '2026-08-11T23:59:00.000Z'
      FlexibleTimeWindow: { Mode: 'OFF' }
      State: ENABLED
      Target:
        Arn: !GetAtt DailyScraperFunction.Arn
        RoleArn: !GetAtt RampUpScraperSchedulerRole.Arn
  DailyScraperScheduleResume:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: ClearingAdvisor-DailyScraperResume
      Description: >-
        Resumes the ordinary daily 07:00 UTC scrape from 14 Aug 2026
        onwards, once the 12/13 Aug dedicated schedules have finished.
      ScheduleExpression: 'cron(0 7 * * ? *)'
      ScheduleExpressionTimezone: UTC
      StartDate: '2026-08-14T00:00:00.000Z'
      FlexibleTimeWindow: { Mode: 'OFF' }
      State: ENABLED
      Target:
        Arn: !GetAtt DailyScraperFunction.Arn
        RoleArn: !GetAtt RampUpScraperSchedulerRole.Arn

  # Pre-Results-Day ramp-up: hourly, from creation up to and including
  # 11 Aug 2026 - trimmed one day earlier than before so it hands off
  # cleanly to Aug12Schedule below rather than overlapping with it for a
  # whole day. No code change to DailyScraper - it's idempotent, so a
  # higher frequency only narrows the detection window.
  # NOTE: hourly x 44 universities over ~3 weeks is a real, sustained load
  # on other institutions' clearing pages (order of tens of thousands of
  # requests total) - flagged as worth reconsidering if any university
  # starts rate-limiting or blocking the scraper's User-Agent.
  RampUpScraperSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: ClearingAdvisor-RampUpScraper
      Description: >-
        Hourly DailyScraper runs from creation until 11 Aug 2026 23:59 UTC,
        ramping up detection frequency ahead of the 12/13 Aug dedicated
        schedules below.
      ScheduleExpression: 'rate(1 hour)'
      ScheduleExpressionTimezone: UTC
      EndDate: '2026-08-11T23:59:00.000Z'
      FlexibleTimeWindow: { Mode: 'OFF' }
      State: ENABLED
      Target:
        Arn: !GetAtt DailyScraperFunction.Arn
        RoleArn: !GetAtt RampUpScraperSchedulerRole.Arn

  # 12 Aug 2026 (day before Results Day): every 30 minutes, all day.
  # Bounded to this single day only - Aug13MorningSchedule below takes
  # over at 00:00 UTC on the 13th.
  Aug12Schedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: ClearingAdvisor-Aug12Scraper
      Description: 12 Aug 2026 - every 30 minutes, all day.
      ScheduleExpression: 'rate(30 minutes)'
      ScheduleExpressionTimezone: UTC
      StartDate: '2026-08-12T00:00:00.000Z'
      EndDate: '2026-08-12T23:59:00.000Z'
      FlexibleTimeWindow: { Mode: 'OFF' }
      State: ENABLED
      Target:
        Arn: !GetAtt DailyScraperFunction.Arn
        RoleArn: !GetAtt RampUpScraperSchedulerRole.Arn

  # 13 Aug 2026 (Results Day), morning/day: every 10 minutes from 07:00 UTC
  # (08:00 BST, when real UCAS results are released) to 20:00 UTC
  # (21:00 BST) - matching the ScaleUp/ScaleDown window in
  # stacks/scaling.yaml, since that's when universities are most likely to
  # open/close vacancies multiple times in a day and a slower check is the
  # least useful.
  Aug13MorningSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: ClearingAdvisor-Aug13MorningScraper
      Description: 13 Aug 2026 08:00-21:00 BST - every 10 minutes.
      ScheduleExpression: 'rate(10 minutes)'
      ScheduleExpressionTimezone: UTC
      StartDate: '2026-08-13T07:00:00.000Z'
      EndDate: '2026-08-13T20:00:00.000Z'
      FlexibleTimeWindow: { Mode: 'OFF' }
      State: ENABLED
      Target:
        Arn: !GetAtt DailyScraperFunction.Arn
        RoleArn: !GetAtt RampUpScraperSchedulerRole.Arn

  # 13 Aug 2026, evening: drops to every 30 minutes from 20:00 UTC
  # (21:00 BST) - the same moment ScheduleManager reverts provisioned
  # concurrency/throttle back to base (see stacks/scaling.yaml's
  # ScaleDownCron) - through the end of the day.
  Aug13EveningSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: ClearingAdvisor-Aug13EveningScraper
      Description: 13 Aug 2026 21:00 BST onwards - every 30 minutes.
      ScheduleExpression: 'rate(30 minutes)'
      ScheduleExpressionTimezone: UTC
      StartDate: '2026-08-13T20:00:00.000Z'
      EndDate: '2026-08-13T23:59:00.000Z'
      FlexibleTimeWindow: { Mode: 'OFF' }
      State: ENABLED
      Target:
        Arn: !GetAtt DailyScraperFunction.Arn
        RoleArn: !GetAtt RampUpScraperSchedulerRole.Arn

  # WarmUp on Results Day (13 Aug 2026) at 05:00 UTC = 06:00 BST.
  WarmUpSchedule:
    Type: AWS::Events::Rule
    Properties:
      Name: ClearingAdvisor-WarmUp
      ScheduleExpression: 'cron(0 5 13 8 ? 2026)'
      State: ENABLED
      Targets:
        - Id: WarmUp
          Arn: !GetAtt WarmUpFunction.Arn
  WarmUpInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref WarmUpFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt WarmUpSchedule.Arn

  # CostReporter daily at 06:00 UTC - after Cost Explorer's data for the
  # previous day is reliably available (it typically lags ~24h, sometimes
  # updating a few times during the day, so running just after midnight
  # would risk reading an incomplete number).
  CostReporterSchedule:
    Type: AWS::Events::Rule
    Properties:
      Name: ClearingAdvisor-CostReporter
      ScheduleExpression: 'cron(0 6 * * ? *)'
      State: ENABLED
      Targets:
        - Id: CostReporter
          Arn: !GetAtt CostReporterFunction.Arn
  CostReporterInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref CostReporterFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt CostReporterSchedule.Arn

Outputs:
  SearchCoursesArn: { Value: !GetAtt SearchCoursesFunction.Arn, Export: { Name: !Sub '${AWS::StackName}-SearchCoursesArn' } }
  SearchCoursesAliasArn: { Value: !Ref SearchCoursesAlias, Export: { Name: !Sub '${AWS::StackName}-SearchCoursesAliasArn' } }
  GenerateExportArn: { Value: !GetAtt GenerateExportFunction.Arn, Export: { Name: !Sub '${AWS::StackName}-GenerateExportArn' } }
  GetSubjectsArn: { Value: !GetAtt GetSubjectsFunction.Arn, Export: { Name: !Sub '${AWS::StackName}-GetSubjectsArn' } }
  GetUniversitiesArn: { Value: !GetAtt GetUniversitiesFunction.Arn, Export: { Name: !Sub '${AWS::StackName}-GetUniversitiesArn' } }
  GetScholarshipsArn: { Value: !GetAtt GetScholarshipsFunction.Arn, Export: { Name: !Sub '${AWS::StackName}-GetScholarshipsArn' } }
  HealthArn: { Value: !GetAtt HealthFunction.Arn, Export: { Name: !Sub '${AWS::StackName}-HealthArn' } }
  SearchCoursesName: { Value: !Ref SearchCoursesFunction }
